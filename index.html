<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/index.css">
   <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">


</head>
<body class="bg-gray-50 text-gray-800 font-sans mx-auto">
   <nav class="bg-white/80 backdrop-blur-md border-b mx-auto sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 min-h-[5rem] flex flex-col md:flex-row md:justify-between md:items-center py-4 md:py-0">
        
        <div class="flex justify-between items-center w-full md:w-auto">
            <div class="flex items-center gap-2 text-xl sm:text-2xl font-bold text-blue-600">
                <i class="fa-solid fa-bag-shopping"></i>
                <span>SwiftCart</span>
            </div>

            <div class="flex items-center md:hidden">
                <button class="relative p-3 bg-slate-100 rounded-full hover:bg-blue-100 transition">
                    <i class="fa-solid fa-cart-shopping text-lg"></i>
                    <span class="absolute -top-1 -right-1 bg-blue-600 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full border-2 border-white">0</span>
                </button>
            </div>
        </div>
        
        <div class="flex flex-wrap justify-center items-center gap-4 sm:gap-6 md:gap-8 font-semibold text-slate-600 mt-4 md:mt-0 text-sm sm:text-base">
            <a href="#" class="hover:text-blue-600 transition">Home</a>
            <a href="#products" class="hover:text-blue-600 transition">Product</a>
            <a href="#about" class="hover:text-blue-600 transition">About</a>
            <a href="#" class="hover:text-blue-600 transition">Contact</a>
        </div>

        <div class="hidden md:flex items-center">
            <button class="relative p-3 bg-slate-100 rounded-full hover:bg-blue-100 transition group">
                <i class="fa-solid fa-cart-shopping text-xl group-hover:text-blue-600"></i>
                <span id="cart-count" class="absolute -top-1 -right-1 bg-blue-600 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full border-2 border-white">0</span>
            </button>
        </div>

    </div>
</nav>

    <section class="max-w-7xl mx-auto px-4 py-16 ">
        <h2 class="text-3xl font-bold text-slate-800 mb-8 text-center">Our Products</h2>

        <div id="products-container" class="justify-center flex gap-5 flex-wrap mb-12 "></div>

    </section>

    <section class="p-10 w-11/12  ">
          <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 mx-auto">
           
        </div>
    </section>

    <script src="./js/script.js"></script>
</body>
</html>
